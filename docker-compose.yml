services:
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["sh", "-lc", "test -f .env || cp .env.example .env; composer install --no-interaction && (grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force)"]
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ereader
      DB_USERNAME: ereader
      DB_PASSWORD: ereader
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ereader
      DB_USERNAME: ereader
      DB_PASSWORD: ereader
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: biblioteca@example.test
      MAIL_FROM_NAME: Minha Biblioteca
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "database", "--sleep=2", "--tries=3", "--timeout=60"]
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ereader
      DB_USERNAME: ereader
      DB_PASSWORD: ereader
      REDIS_HOST: redis
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy

  vite:
    image: node:24-alpine
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_APP_NAME: "Minha Biblioteca"
    depends_on:
      app:
        condition: service_started
      setup:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ereader
      POSTGRES_USER: ereader
      POSTGRES_PASSWORD: ereader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ereader -d ereader"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  composer_vendor:
  node_modules:
  postgres_data:
  redis_data:
